name: Daily US market news

on:
  schedule:
    # 22:15 UTC, Mon-Fri: after the US close in both EDT and EST (北京时间次日 06:15).
    - cron: "15 22 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "Trading day YYYY-MM-DD (empty = latest)"
        required: false
        default: ""
      force:
        description: "Rebuild even if the day already exists"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # The built site (all past days) lives on the `site-data` branch.
      - name: Restore site
        run: |
          if git ls-remote --exit-code --heads origin site-data >/dev/null; then
            git fetch --depth=1 origin site-data
            git worktree add --detach site FETCH_HEAD
          else
            git worktree add --detach site
            git -C site checkout --orphan site-data
            git -C site rm -rfq .
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEWSBOT_MODEL: ${{ vars.NEWSBOT_MODEL }}
          DATE: ${{ inputs.date }}
          FORCE: ${{ inputs.force }}
        run: |
          [ -n "$NEWSBOT_MODEL" ] || unset NEWSBOT_MODEL
          args=(--site-dir site)
          [ -n "$DATE" ] && args+=(--date "$DATE")
          [ "$FORCE" = "true" ] && args+=(--force)
          python -m newsbot.build "${args[@]}"

      - name: Save site
        run: |
          cd site
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Update $(date -u +%F)"
          git push origin HEAD:refs/heads/site-data

      - name: Prepare upload
        run: cp -a site public && rm -rf public/.git

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
